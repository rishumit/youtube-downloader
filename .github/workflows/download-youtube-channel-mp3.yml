name: Download YouTube Channel MP3s

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: YouTube channel URL (prefer the channel's /videos page)
        required: true
        type: string
      authorized_download:
        description: I own this content or have permission to download it
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Validate request
        env:
          CHANNEL_URL: ${{ inputs.channel_url }}
          AUTHORIZED_DOWNLOAD: ${{ inputs.authorized_download }}
        run: |
          set -euo pipefail

          if [[ "$AUTHORIZED_DOWNLOAD" != "true" ]]; then
            echo "::error::Confirm that you own this content or have permission to download it."
            exit 1
          fi

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["CHANNEL_URL"].strip()
          parsed = urlparse(url)
          channel_path = parsed.path.startswith(("/@", "/channel/", "/c/", "/user/"))
          if parsed.scheme != "https" or parsed.hostname not in {
              "youtube.com", "www.youtube.com", "m.youtube.com"
          } or not channel_path:
              raise SystemExit("Enter a YouTube channel URL, such as https://www.youtube.com/@handle/videos.")
          PY

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade yt-dlp "bgutil-ytdlp-pot-provider==2.0.2"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO Token provider
        run: |
          git clone --depth 1 --single-branch --branch 2.0.2 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil"

          cd "$RUNNER_TEMP/bgutil/server"
          deno install --allow-scripts=npm:canvas --frozen

          deno run --allow-env --allow-net --allow-ffi=. --allow-read=. \
            src/main.ts > "$RUNNER_TEMP/bgutil-pot-provider.log" 2>&1 &

          provider_pid=$!
          for attempt in {1..10}; do
            if ! kill -0 "$provider_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/bgutil-pot-provider.log"
              echo "PO Token provider stopped unexpectedly."
              exit 1
            fi
            sleep 1
          done

      - name: Download channel audio and create ZIP
        env:
          CHANNEL_URL: ${{ inputs.channel_url }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          cookie_file="$RUNNER_TEMP/youtube-cookies.txt"
          trap 'rm -f "$cookie_file"' EXIT

          args=(
            --remote-components ejs:github
            --js-runtimes deno
            --extractor-args "youtube:player_client=mweb"
            --yes-playlist
            --extract-audio
            --audio-format mp3
            --audio-quality 0
            -o 'downloads/%(title)s [%(id)s].%(ext)s'
          )

          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            umask 077
            printf '%s' "$YOUTUBE_COOKIES" > "$cookie_file"
            args+=(--cookies "$cookie_file")
          fi

          yt-dlp "${args[@]}" -- "$CHANNEL_URL"

          python - <<'PY'
          from pathlib import Path
          import zipfile

          downloads = Path("downloads")
          files = sorted(
              path for path in downloads.rglob("*")
              if path.is_file() and path.suffix.lower() == ".mp3"
          )
          if not files:
              raise SystemExit("No MP3 files were downloaded.")

          max_part_bytes = 1_800_000_000
          upload_limit_bytes = 2_147_483_648
          parts = []
          current_part = []
          current_part_size = 22

          for path in files:
              archive_name = path.relative_to(downloads).as_posix()
              estimated_size = path.stat().st_size + 2 * len(archive_name.encode("utf-8")) + 128
              if estimated_size > max_part_bytes:
                  raise SystemExit(f"{path.name} is too large to fit in a ZIP part.")
              if current_part and current_part_size + estimated_size > max_part_bytes:
                  parts.append(current_part)
                  current_part = []
                  current_part_size = 22
              current_part.append(path)
              current_part_size += estimated_size
          if current_part:
              parts.append(current_part)

          for part_number, part_files in enumerate(parts, start=1):
              archive_path = Path(f"youtube-channel-mp3-{part_number:03}.zip")
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_STORED) as archive:
                  for path in part_files:
                      archive.write(path, arcname=path.relative_to(downloads))
              if archive_path.stat().st_size >= upload_limit_bytes:
                  raise SystemExit(f"{archive_path.name} exceeds GitHub's 2 GiB release asset limit.")
          PY

      - name: Upload ZIP parts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: youtube-mp3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          shopt -s nullglob
          archives=(youtube-channel-mp3-*.zip)
          if ((${#archives[@]} == 0)); then
            echo "::error::No ZIP archives were created."
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${archives[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YouTube channel MP3s $RELEASE_TAG" \
            --notes "Authorized channel audio downloaded by GitHub Actions run $GITHUB_RUN_ID. Download every numbered ZIP part."
